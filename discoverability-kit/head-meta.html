<!--
  Agentic Guardians · recommended <head> tags (v2)
  Title now uses the proposal's positioning "The runtime trust layer for AI agents";
  social titles use the approved tagline "AI trust you can prove".
  Replace [[DOMAIN]] with the final origin, no trailing slash (e.g. https://example.com).
  Meta description: kept exactly as on developer-v7 (the agreed existing line). It is
  121 characters, well within the ~155-160 snippet limit, and already states what the product
  does and what makes it different, so there is no strong reason to change it.
  NOTE: envelope-v2 currently uses a variant ("scores behavioural sequences before every
  action runs"); this kit standardises on the developer-v7 wording.
  NOTE: twitter:site left as a placeholder until there is a company X handle.
  NOTE: remove <meta name="robots" content="noindex,nofollow"> from whichever version
  ships (envelope-v2 and the preview index currently carry it).
-->
<title>Agentic Guardians · The runtime trust layer for AI agents</title>
<meta name="description" content="Agentic Guardians scores your agent’s behaviour before every action runs. It doesn’t read prompts. It can’t be persuaded.">
<link rel="canonical" href="[[DOMAIN]]/">
<meta name="robots" content="index,follow">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Agentic Guardians">
<meta property="og:title" content="Agentic Guardians · AI trust you can prove">
<meta property="og:description" content="Agentic Guardians scores your agent’s behaviour before every action runs. It doesn’t read prompts. It can’t be persuaded.">
<meta property="og:url" content="[[DOMAIN]]/">
<meta property="og:image" content="[[DOMAIN]]/[[OG_IMAGE_PATH e.g. og.png, 1200x630]]">
<meta property="og:image:alt" content="Agentic Guardians · The runtime trust layer for AI agents">
<meta property="og:locale" content="en_GB">

<!-- Twitter / X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="[[X_HANDLE e.g. @handle]]">
<meta name="twitter:title" content="Agentic Guardians · AI trust you can prove">
<meta name="twitter:description" content="Agentic Guardians scores your agent’s behaviour before every action runs. It doesn’t read prompts. It can’t be persuaded.">
<meta name="twitter:image" content="[[DOMAIN]]/[[OG_IMAGE_PATH]]">

<!-- Pointers for AI assistants -->
