<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Split · hero option</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;background:#0a0a0a;color:#ededed;font-family:"Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}p{margin:0;text-wrap:balance}b{font-weight:800}
.nav{position:relative;z-index:5;display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;padding:18px 40px;font-size:14px;color:#a1a1a1}.nav b{color:#ededed;font-weight:500}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ddc84;margin-left:6px}.btn{margin-left:auto;background:#f2f2f2;color:#111;padding:8px 14px;border-radius:6px;font-weight:500}
.fade{opacity:0;animation:fi 1s ease forwards}@keyframes fi{to{opacity:1}}@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}}
.mono{font-family:"JetBrains Mono",monospace}
@media(max-width:760px){.nav{padding:16px 20px}}
body{background:linear-gradient(90deg,#0a0a0a 0 50%,#f4f4f1 50% 100%)}.nav{max-width:none}.nav .btn{background:#0a0a0a;color:#fff}
.sp{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 66px)}
.sp .L{padding:10vh 56px 0 max(40px,calc(50vw - 600px));display:flex;flex-direction:column}
.sp .L .l1{font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1.02;max-width:560px}
.sp .L .l2{margin-top:40px;font-size:24px;font-weight:400;color:#e5484d;letter-spacing:-.015em;line-height:1.3;max-width:460px}
.sp .L .l3{margin-top:auto;margin-bottom:10vh;font-size:24px;font-weight:400;letter-spacing:-.015em;line-height:1.3;max-width:480px;color:#d4d4d8}.sp .L .l3 b{color:#fff}
.sp .R{color:#0a0a0a;display:flex;align-items:center;padding:0 max(40px,calc(50vw - 600px)) 0 72px}
.sp .R p{font-size:72px;font-weight:800;letter-spacing:-.045em;line-height:1}
.sp .R .g{display:inline-block;width:14px;height:14px;border-radius:50%;background:#3ddc84;margin-left:10px;vertical-align:.12em}
@media(max-width:760px){body{background:#0a0a0a}.sp{grid-template-columns:1fr;height:auto}.sp .L{padding:32px 20px 40px}.sp .L .l1{font-size:36px}.sp .L .l2,.sp .L .l3{font-size:20px}.sp .L .l3{margin:32px 0 0}.sp .R{background:#f4f4f1;padding:56px 20px 64px}.sp .R p{font-size:44px}.nav .btn{background:#f2f2f2;color:#111}}</style></head><body><div class="nav"><span>Agentic <b>GUARDIANS</b><i class="dot"></i></span><span class="btn">Get early access</span></div>
<main class="sp"><div class="L fade"><p class="l1">Do you know what your agent is doing right now?</p><p class="l2">A compromised agent doesn’t look compromised.</p><p class="l3">Can you <b>trust</b> it to do what it’s supposed to, and only that?</p></div><div class="R fade" style="animation-delay:.6s"><p>With Agentic Guardians, you can.</p></div></main></body></html>
