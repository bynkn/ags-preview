<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#0a0a0b;color:#ededee;font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;

nav{display:flex;align-items:center;gap:8px;width:100%;max-width:1200px;margin:0 auto;padding:22px 28px;font-size:15px;color:#9a9aa0}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px 48px;text-align:center;width:100%;max-width:1200px;margin:0 auto}
.mono{font-family:"JetBrains Mono",monospace}
.g{color:#3ddc84}.r{color:#ff5a52}.mute{color:#6b6b72}
h1{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1.08;margin:0 0 18px;max-width:900px;text-wrap:balance}
.copy p{margin:4px 0;font-size:17px;color:#a8a8ae;font-weight:400;line-height:1.5}.copy strong{font-weight:800;color:#fff}.copy .you{font-weight:700;color:#fff}
.cur{display:inline-block;width:.6em;height:1.1em;background:#ededee;vertical-align:-.2em;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.visual{margin:0 0 40px;width:100%}
@media(max-width:700px){h1{font-size:30px}.copy p{font-size:15px}nav{padding:16px 18px}}

.ask{font-size:15px;color:#cfcfd3;margin:0 0 18px;font-weight:500}.ask b{font-weight:700;color:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:760px;margin:0 auto}
.card{all:unset;cursor:pointer;display:block;text-align:left;background:#121214;border:1px solid #2a2a2e;border-radius:10px;padding:18px 20px;transition:border-color .5s,transform .15s}
.card:hover{border-color:#44444a}.card:focus-visible{outline:2px solid #666;outline-offset:3px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.nm{font-size:15px;color:#fff;font-weight:500}.st{font-size:13px;color:#cfcfd3;display:flex;align-items:center;gap:7px}
dl{margin:0;display:grid;grid-template-columns:96px 1fr;row-gap:8px;font-size:13px}dt{color:#6b6b72}dd{margin:0;color:#d4d4d8}dd.mono{font-size:12.5px}
.reveal{height:24px;margin:16px 0 0;font-size:15px;color:#fff;font-weight:600;opacity:0;transition:opacity .4s}
.done .reveal{opacity:1}.done .card.bad{border-color:#ff5a52;box-shadow:0 0 0 1px #ff5a52}.done .card{cursor:default}
@media(max-width:700px){.pair{grid-template-columns:1fr;gap:12px}.card{padding:14px 16px}dl{row-gap:5px}.visual{margin-bottom:26px}}
</style></head><body>
