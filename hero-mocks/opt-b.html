<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swiss poster · hero option</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;background:#0a0a0a;color:#ededed;font-family:"Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}p{margin:0;text-wrap:balance}b{font-weight:800}
.nav{position:relative;z-index:5;display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;padding:18px 40px;font-size:14px;color:#a1a1a1}.nav b{color:#ededed;font-weight:500}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ddc84;margin-left:6px}.btn{margin-left:auto;background:#f2f2f2;color:#111;padding:8px 14px;border-radius:6px;font-weight:500}
.fade{opacity:0;animation:fi 1s ease forwards}@keyframes fi{to{opacity:1}}@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}}
.mono{font-family:"JetBrains Mono",monospace}
@media(max-width:760px){.nav{padding:16px 20px}}
body{background:#0a0a0a}.po{position:relative;height:calc(100vh - 66px);display:grid;grid-template-columns:72px 1fr;grid-template-rows:auto auto 1fr}
.po .v{grid-row:1/4;grid-column:1;border-right:1px solid #222;display:flex;align-items:flex-end;justify-content:center;padding-bottom:40px}
.po .v p{writing-mode:vertical-rl;transform:rotate(180deg);font-size:15px;font-weight:400;letter-spacing:.02em;color:#bdbdc2;white-space:nowrap}.po .v b{color:#fff}
.po .h{grid-column:2;padding:7vh 56px 5vh;font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1;max-width:1000px}
.po .red{grid-column:2;background:#e5484d;color:#0a0a0a;padding:28px 56px}.po .red p{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.po .wh{grid-column:2;background:#f2f2ef;color:#0a0a0a;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 56px 40px}.po .wh p{font-size:40px;font-weight:800;letter-spacing:-.03em}
@media(max-width:760px){.po{grid-template-columns:40px 1fr;height:auto}.po .v{padding-bottom:24px}.po .v p{font-size:12px}.po .h{padding:32px 20px;font-size:36px}.po .red{padding:20px}.po .red p,.po .wh p{font-size:26px}.po .wh{padding:60px 20px 24px}}</style></head><body><div class="nav"><span>Agentic <b>GUARDIANS</b><i class="dot"></i></span><span class="btn">Get early access</span></div>
<main class="po fade"><div class="v"><p>Can you <b>trust</b> it to do what it’s supposed to, and only that?</p></div><p class="h">Do you know what your agent is doing right now?</p><div class="red"><p>A compromised agent doesn’t look compromised.</p></div><div class="wh"><p>With Agentic Guardians, you can.</p></div></main></body></html>
