<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet cursor · hero option</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;background:#0a0a0a;color:#ededed;font-family:"Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}p{margin:0;text-wrap:balance}b{font-weight:800}
.nav{position:relative;z-index:5;display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;padding:18px 40px;font-size:14px;color:#a1a1a1}.nav b{color:#ededed;font-weight:500}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ddc84;margin-left:6px}.btn{margin-left:auto;background:#f2f2f2;color:#111;padding:8px 14px;border-radius:6px;font-weight:500}
.fade{opacity:0;animation:fi 1s ease forwards}@keyframes fi{to{opacity:1}}@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}}
.mono{font-family:"JetBrains Mono",monospace}
@media(max-width:760px){.nav{padding:16px 20px}}
.qc{position:relative;height:calc(100vh - 66px);max-width:1280px;margin:0 auto;padding:0 40px}
.qc p{position:absolute;max-width:440px;font-size:24px;font-weight:400;letter-spacing:-.015em;line-height:1.3}
.qc .tl{top:8vh;left:40px;font-size:28px;font-weight:700;max-width:520px}.qc .tr{top:8vh;right:40px;text-align:right;color:#9a9aa0}
.qc .bl{bottom:10vh;left:40px}.qc .br{bottom:10vh;right:40px;text-align:right;font-size:28px;font-weight:800}
.qc .tick{position:absolute;width:14px;height:14px;border-color:#333;border-style:solid}.k1{top:calc(8vh - 22px);left:18px;border-width:1px 0 0 1px}.k2{top:calc(8vh - 22px);right:18px;border-width:1px 1px 0 0}.k3{bottom:calc(10vh - 22px);left:18px;border-width:0 0 1px 1px}.k4{bottom:calc(10vh - 22px);right:18px;border-width:0 1px 1px 0}
.qc .mark{position:absolute;left:50%;top:50%;width:1px;height:28px;margin:-14px 0 0;background:#2a2a2a}.qc .mark::after{content:"";position:absolute;left:-14px;top:14px;width:28px;height:1px;background:#2a2a2a}
.car{display:inline-block;width:2px;height:1.05em;background:#ededed;margin-left:4px;vertical-align:-.15em;animation:bk 1.05s steps(1) infinite}@keyframes bk{50%{opacity:0}}
.qc .c2{color:#e5484d}
@media(max-width:760px){.qc{height:auto;padding:24px 20px 40px;display:flex;flex-direction:column;gap:56px}.qc p{position:static;max-width:none;text-align:left!important;font-size:20px}.qc .tl,.qc .br{font-size:26px}.qc .tick,.qc .mark{display:none}.qc .br{text-align:right!important}}</style></head><body><div class="nav"><span>Agentic <b>GUARDIANS</b><i class="dot"></i></span><span class="btn">Get early access</span></div>
<main class="qc fade"><i class="tick k1"></i><i class="tick k2"></i><i class="tick k3"></i><i class="tick k4"></i><i class="mark"></i><p class="tl">Do you know what your agent is doing right now?</p><p class="tr">A <span class="c2">compromised</span> agent doesn’t look compromised.</p><p class="bl">Can you <b>trust</b> it to do what it’s supposed to, and only that?<span class="car"></span></p><p class="br">With Agentic Guardians, you can.</p></main></body></html>
