<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swiss grid · hero option</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;background:#0a0a0a;color:#ededed;font-family:"Inter Tight",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}p{margin:0;text-wrap:balance}b{font-weight:800}
.nav{position:relative;z-index:5;display:flex;align-items:center;gap:16px;max-width:1280px;margin:0 auto;padding:18px 40px;font-size:14px;color:#a1a1a1}.nav b{color:#ededed;font-weight:500}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ddc84;margin-left:6px}.btn{margin-left:auto;background:#f2f2f2;color:#111;padding:8px 14px;border-radius:6px;font-weight:500}
.fade{opacity:0;animation:fi 1s ease forwards}@keyframes fi{to{opacity:1}}@media(prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}}
.mono{font-family:"JetBrains Mono",monospace}
@media(max-width:760px){.nav{padding:16px 20px}}
.sw{max-width:1280px;margin:0 auto;padding:6vh 40px 0;display:grid;grid-template-columns:repeat(12,1fr);column-gap:20px;row-gap:5.5vh}
.sw .it{border-top:1px solid #333;padding-top:14px;display:grid;grid-template-columns:44px 1fr;align-items:start}
.sw .n{font:500 12px "JetBrains Mono",monospace;color:#6b6b70;padding-top:6px}.sw .n.red{color:#e5484d}
.i1{grid-column:1/9}.i1 p{font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1}
.i2{grid-column:6/12}.i2 p,.i3 p{font-size:28px;font-weight:400;letter-spacing:-.02em;line-height:1.25}.i2{border-top-color:#e5484d}
.i3{grid-column:2/8}.i3 p{color:#bdbdc2}.i3 b{color:#ededed}
.i4{grid-column:7/13}.i4 p{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.bgg{position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(90deg,#161616 1px,transparent 1px);background-size:calc((min(100vw,1280px) - 80px - 220px)/12 + 20px) 100%;background-position:calc(50% - 0px) 0;opacity:.0}
@media(max-width:760px){.sw{grid-template-columns:1fr;padding:24px 20px 40px;row-gap:28px}.i1,.i2,.i3,.i4{grid-column:1}.i1 p{font-size:40px}.i2 p,.i3 p{font-size:22px}.i4 p{font-size:30px}}</style></head><body><div class="nav"><span>Agentic <b>GUARDIANS</b><i class="dot"></i></span><span class="btn">Get early access</span></div>
<main class="sw fade"><div class="it i1"><span class="n">01</span><p>Do you know what your agent is doing right now?</p></div><div class="it i2"><span class="n red">02</span><p>A compromised agent doesn’t look compromised.</p></div><div class="it i3"><span class="n">03</span><p>Can you <b>trust</b> it to do what it’s supposed to, and only that?</p></div><div class="it i4"><span class="n">04</span><p>With Agentic Guardians, you can.</p></div></main></body></html>
